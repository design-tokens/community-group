name: Discord Push Notification

on:
  push:
    branches: [main]

jobs:
  notify-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord Notification
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_ANNOUNCEMENTS_WEBHOOK }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          AUTHOR: ${{ github.event.head_commit.author.username }}
          TIMESTAMP: ${{ github.event.head_commit.timestamp }}
        run: |
          PAYLOAD=$(python3 - <<'PY'
          import json
          import os

          commit_message = os.environ.get("COMMIT_MESSAGE", "")
          commit_title = commit_message.splitlines()[0] if commit_message else ""

          print(json.dumps({
              "embeds": [{
                  "title": "New update pushed to main",
                  "description": commit_title,
                  "url": os.environ["COMMIT_URL"],
                  "color": 5732594,
                  "fields": [{
                      "name": "Author",
                      "value": os.environ["AUTHOR"],
                      "inline": True,
                  }],
                  "footer": {"text": "GitHub Push"},
                  "timestamp": os.environ["TIMESTAMP"],
              }]
          }))
          PY
          )

          curl -sf -X POST \
            -H 'Content-Type: application/json' \
            -d "$PAYLOAD" \
            "$WEBHOOK_URL"
