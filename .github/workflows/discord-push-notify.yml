name: Discord Push Notification

on:
  push:
    branches: [main, copilot/fix-notify-discord-job]

jobs:
  notify-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord Notification
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_ANNOUNCEMENTS_WEBHOOK }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMPARE_URL: ${{ github.event.compare }}
          AUTHOR: ${{ github.event.head_commit.author.username }}
          TIMESTAMP: ${{ github.event.head_commit.timestamp }}
        run: |
          PAYLOAD=$(python3 - <<'PY'
          from datetime import datetime, timezone
          import json
          import os

          commit_message = os.environ.get("COMMIT_MESSAGE", "")
          commit_lines = commit_message.splitlines()
          commit_title = (commit_lines[0] if commit_lines else "")[:4096]
          compare_url = os.environ.get("COMPARE_URL", "")
          author = (os.environ.get("AUTHOR") or "").strip() or "Unknown"
          timestamp = os.environ.get("TIMESTAMP", "")

          normalized_timestamp = ""
          if timestamp:
              try:
                  normalized_timestamp = (
                      datetime.fromisoformat(timestamp)
                      .astimezone(timezone.utc)
                      .replace(microsecond=0)
                      .isoformat()
                      .replace("+00:00", "Z")
                  )
              except ValueError:
                  normalized_timestamp = ""

          embed = {
              "title": "New update pushed to main",
              "description": commit_title,
              "color": 5732594,
              "fields": [{
                  "name": "Author",
                  "value": author,
                  "inline": True,
              }],
              "footer": {"text": "GitHub Push"},
          }

          if compare_url:
              embed["url"] = compare_url

          if normalized_timestamp:
              embed["timestamp"] = normalized_timestamp

          print(json.dumps({"embeds": [embed]}))
          PY
          )

          curl -sf -X POST \
            -H 'Content-Type: application/json' \
            -d "$PAYLOAD" \
            "$WEBHOOK_URL"
